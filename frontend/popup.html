<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>VeritAI</title>
  <style>
    :root {
      --bg: #1b2331; --surface: #232d3d; --border: #334056; --text: #e3e8ef; --sub: #a8b3c4; --muted: #7a879b;
      --fake: #ef6f72; --real: #52c08c; --track: #3a465b; --on: #4f7fd1; --knob-on: #ffffff;
    }
    * { box-sizing: border-box; }
    body { width: 300px; margin: 0; padding: 16px; background: var(--bg); color: var(--text);
      font: 13px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    button { font: inherit; }

    .head { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .head svg { width: 20px; height: 20px; color: #8fb3f0; }
    .head h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.2px; }
    .head .ver { margin-left: auto; font-size: 11px; color: var(--muted); }

    .stats { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border-radius: 10px; margin-bottom: 14px; }
    .stat { padding: 10px 12px; }
    .stat + .stat { border-left: 1px solid var(--border); }
    .stat-value { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
    .stat-value.is-fake { color: var(--fake); }
    .stat-label { font-size: 11px; color: var(--sub); }

    .settings { border: 1px solid var(--border); border-radius: 10px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; }
    .row + .row { border-top: 1px solid var(--border); }
    .row-title { font-weight: 600; }
    .row-desc { font-size: 11px; color: var(--sub); }

    .switch { position: relative; display: inline-block; width: 36px; height: 20px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: var(--track); border-radius: 20px; cursor: pointer; transition: background 0.15s ease; }
    .slider:before { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: transform 0.15s ease; }
    input:checked + .slider { background: var(--on); }
    input:checked + .slider:before { transform: translateX(16px); background: var(--knob-on); }
    input:disabled + .slider { opacity: 0.4; cursor: not-allowed; }
    input:focus-visible + .slider { outline: 2px solid #8fb3ff; outline-offset: 2px; }

    #status-text { margin: 10px 2px 0; font-size: 12px; color: var(--sub); min-height: 18px; }
    #status-text.is-ok { color: var(--real); }
    #status-text.is-error { color: var(--fake); }

    .links { display: flex; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
    .link-btn { flex: 1; height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; }
    .link-btn:hover { background: var(--surface); }
    .link-btn:focus-visible { outline: 2px solid #8fb3ff; outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="head">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4.5 6v6c0 4.5 3.2 7.7 7.5 9 4.3-1.3 7.5-4.5 7.5-9V6L12 3Z"/><path d="m8.8 12 2.2 2.2 4.2-4.4"/></svg>
    <h1>VeritAI</h1>
    <span class="ver">v1.1</span>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="stat-scanned">0</div>
      <div class="stat-label">오늘 검사한 사진</div>
    </div>
    <div class="stat">
      <div class="stat-value is-fake" id="stat-blocked">0</div>
      <div class="stat-label">조작 의심</div>
    </div>
  </div>

  <div class="settings">
    <label class="row">
      <span><span class="row-title">VeritAI 켜기</span><br><span class="row-desc">사진에 검사 버튼과 결과를 표시합니다</span></span>
      <span class="switch"><input type="checkbox" id="system-toggle"><span class="slider"></span></span>
    </label>
    <label class="row">
      <span><span class="row-title">자동 검사</span><br><span class="row-desc">보이는 사진을 차례로 검사합니다</span></span>
      <span class="switch"><input type="checkbox" id="auto-toggle"><span class="slider"></span></span>
    </label>
    <label class="row">
      <span><span class="row-title">정상 결과 숨기기</span><br><span class="row-desc">조작 의심만 표시합니다</span></span>
      <span class="switch"><input type="checkbox" id="clean-toggle"><span class="slider"></span></span>
    </label>
  </div>

  <div id="status-text" role="status">설정을 불러오는 중</div>

  <div class="links">
    <button id="feedback-link" class="link-btn">의견 보내기</button>
    <button id="clear-cache-btn" class="link-btn">캐시 비우기</button>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
