spring.application.name=backend_spring
server.port=8080
spring.profiles.default=dev

# Multipart
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Custom
app.upload-dir=${VERITAI_UPLOAD_DIR:uploads}
app.ai-server-url=${VERITAI_AI_SERVER_URL:http://localhost:8000/predict}
app.ai.connect-timeout-ms=${VERITAI_AI_CONNECT_TIMEOUT_MS:3000}
app.ai.connection-request-timeout-ms=${VERITAI_AI_CONNECTION_REQUEST_TIMEOUT_MS:1000}
app.ai.read-timeout-ms=${VERITAI_AI_READ_TIMEOUT_MS:30000}
app.ai.max-connections=${VERITAI_AI_MAX_CONNECTIONS:20}
app.ai.max-connections-per-route=${VERITAI_AI_MAX_CONNECTIONS_PER_ROUTE:10}
app.ai.idle-connection-evict-seconds=${VERITAI_AI_IDLE_CONNECTION_EVICT_SECONDS:30}
app.cors.allowed-origins=${VERITAI_CORS_ALLOWED_ORIGINS:*}
app.detection.queue-capacity=${VERITAI_DETECTION_QUEUE_CAPACITY:100}
app.detection.queue-provider=${VERITAI_DETECTION_QUEUE_PROVIDER:in-memory}
app.detection.database-queue-capacity=${VERITAI_DETECTION_DATABASE_QUEUE_CAPACITY:100000}
app.detection.database-queue-poll-interval-ms=${VERITAI_DETECTION_DATABASE_QUEUE_POLL_INTERVAL_MS:200}
app.detection.recovery-page-size=${VERITAI_DETECTION_RECOVERY_PAGE_SIZE:100}
app.detection.worker-count=${VERITAI_DETECTION_WORKER_COUNT:2}
app.detection.ai-retry-count=${VERITAI_DETECTION_AI_RETRY_COUNT:1}
app.detection.ai-retry-delay-ms=${VERITAI_DETECTION_AI_RETRY_DELAY_MS:500}
app.detection.ai-retry-max-delay-ms=${VERITAI_DETECTION_AI_RETRY_MAX_DELAY_MS:4000}
app.detection.ai-retry-total-timeout-ms=${VERITAI_DETECTION_AI_RETRY_TOTAL_TIMEOUT_MS:15000}
app.detection.ai-retry-jitter-percent=${VERITAI_DETECTION_AI_RETRY_JITTER_PERCENT:20}
app.detection.ai-bulkhead-concurrent-calls=${VERITAI_DETECTION_AI_BULKHEAD_CONCURRENT_CALLS:2}
app.detection.ai-bulkhead-wait-ms=${VERITAI_DETECTION_AI_BULKHEAD_WAIT_MS:1000}
app.detection.ai-circuit-failure-threshold=${VERITAI_DETECTION_AI_CIRCUIT_FAILURE_THRESHOLD:5}
app.detection.ai-circuit-open-ms=${VERITAI_DETECTION_AI_CIRCUIT_OPEN_MS:10000}
app.detection.max-file-size-bytes=${VERITAI_DETECTION_MAX_FILE_SIZE_BYTES:20971520}
app.detection.max-raw-result-json-bytes=${VERITAI_DETECTION_MAX_RAW_RESULT_JSON_BYTES:2097152}
app.detection.upload-retention-days=${VERITAI_UPLOAD_RETENTION_DAYS:7}
app.detection.upload-cleanup-interval-ms=${VERITAI_UPLOAD_CLEANUP_INTERVAL_MS:3600000}
app.detection.batch-status-max-ids=${VERITAI_DETECTION_BATCH_STATUS_MAX_IDS:100}
app.detection.model-version=${VERITAI_MODEL_VERSION:default}
app.detection.pipeline-version=${VERITAI_PIPELINE_VERSION:v1}
