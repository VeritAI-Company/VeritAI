# Production profile: provide values through environment variables.
spring.datasource.url=${VERITAI_DB_URL}
spring.datasource.username=${VERITAI_DB_USERNAME}
spring.datasource.password=${VERITAI_DB_PASSWORD}
spring.datasource.driver-class-name=${VERITAI_DB_DRIVER:org.postgresql.Driver}

spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
